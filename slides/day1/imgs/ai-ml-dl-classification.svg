<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460">
  <!-- AI outer ellipse -->
  <ellipse cx="300" cy="230" rx="260" ry="200" fill="#FFE6CC" fill-opacity="0.6" stroke="#D79B00" stroke-width="2"/>
  <!-- ML middle ellipse -->
  <ellipse cx="300" cy="270" rx="200" ry="140" fill="#D5E8D4" fill-opacity="0.6" stroke="#82B366" stroke-width="2"/>
  <!-- Deep Learning inner ellipse -->
  <ellipse cx="300" cy="310" rx="140" ry="80" fill="#DAE8FC" fill-opacity="0.6" stroke="#6C8EBF" stroke-width="2"/>

  <!-- AI label -->
  <text x="300" y="65" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">人工知能 (AI)</text>
  <text x="300" y="88" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">人間のように考える・判断するコンピュータ技術全般</text>
  <text x="300" y="106" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888">例: チェスAI、音声アシスタント、自動運転</text>

  <!-- ML label -->
  <text x="300" y="165" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">機械学習 (ML)</text>
  <text x="300" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">データから自動で学習して予測・判断する仕組み</text>
  <text x="300" y="204" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#555">AIを実現する中核技術</text>

  <!-- Deep Learning label -->
  <text x="300" y="296" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">深層学習 (Deep Learning)</text>
  <text x="300" y="317" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">大量データから複雑なパターンを学習できるML手法</text>
  <text x="300" y="335" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888">例: 画像認識、音声認識、自然言語処理</text>
</svg>