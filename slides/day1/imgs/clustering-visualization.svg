<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420">
  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">k-means クラスタリング</text>
  <text x="350" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#888">似たデータ同士をk個のクラスタに自動分類する</text>

  <!-- Axes -->
  <line x1="80" y1="360" x2="620" y2="360" stroke="#999" stroke-width="1.5"/>
  <line x1="80" y1="360" x2="80" y2="80" stroke="#999" stroke-width="1.5"/>
  <text x="350" y="395" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888">特徴量 1</text>
  <text x="45" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888" transform="rotate(-90, 45, 220)">特徴量 2</text>

  <!-- Cluster A (Blue) - top left -->
  <circle cx="170" cy="150" r="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5"/>
  <circle cx="200" cy="130" r="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5"/>
  <circle cx="155" cy="180" r="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5"/>
  <circle cx="190" cy="170" r="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5"/>
  <circle cx="220" cy="155" r="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5"/>
  <circle cx="180" cy="200" r="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5"/>
  <circle cx="140" cy="160" r="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5"/>
  <circle cx="210" cy="190" r="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5"/>
  <!-- Cluster A centroid -->
  <line x1="178" y1="162" x2="198" y2="162" stroke="#6C8EBF" stroke-width="3"/>
  <line x1="188" y1="152" x2="188" y2="172" stroke="#6C8EBF" stroke-width="3"/>

  <!-- Cluster B (Green) - bottom middle -->
  <circle cx="320" cy="290" r="8" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
  <circle cx="350" cy="310" r="8" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
  <circle cx="290" cy="320" r="8" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
  <circle cx="340" cy="270" r="8" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
  <circle cx="370" cy="290" r="8" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
  <circle cx="310" cy="340" r="8" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
  <circle cx="360" cy="330" r="8" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
  <circle cx="300" cy="280" r="8" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
  <!-- Cluster B centroid -->
  <line x1="325" y1="300" x2="345" y2="300" stroke="#82B366" stroke-width="3"/>
  <line x1="335" y1="290" x2="335" y2="310" stroke="#82B366" stroke-width="3"/>

  <!-- Cluster C (Orange) - right -->
  <circle cx="500" cy="160" r="8" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.5"/>
  <circle cx="530" cy="140" r="8" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.5"/>
  <circle cx="520" cy="180" r="8" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.5"/>
  <circle cx="550" cy="170" r="8" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.5"/>
  <circle cx="480" cy="190" r="8" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.5"/>
  <circle cx="540" cy="200" r="8" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.5"/>
  <circle cx="510" cy="130" r="8" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.5"/>
  <circle cx="490" cy="150" r="8" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.5"/>
  <!-- Cluster C centroid -->
  <line x1="510" y1="160" x2="530" y2="160" stroke="#D79B00" stroke-width="3"/>
  <line x1="520" y1="150" x2="520" y2="170" stroke="#D79B00" stroke-width="3"/>

  <!-- Legend -->
  <rect x="140" y="380" width="14" height="14" rx="2" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1"/>
  <text x="160" y="393" font-family="sans-serif" font-size="12" fill="#555">クラスタ A</text>
  <rect x="280" y="380" width="14" height="14" rx="2" fill="#D5E8D4" stroke="#82B366" stroke-width="1"/>
  <text x="300" y="393" font-family="sans-serif" font-size="12" fill="#555">クラスタ B</text>
  <rect x="420" y="380" width="14" height="14" rx="2" fill="#FFE6CC" stroke="#D79B00" stroke-width="1"/>
  <text x="440" y="393" font-family="sans-serif" font-size="12" fill="#555">クラスタ C</text>
  <text x="570" y="393" font-family="sans-serif" font-size="12" fill="#555">＋ = 中心点</text>
</svg>