<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="Arial, sans-serif">
  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">混同行列（Confusion Matrix）と Precision / Recall</text>

  <!-- Confusion Matrix Section -->
  <text x="210" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">混同行列</text>

  <!-- Column headers -->
  <text x="200" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">予測: 陽性</text>
  <text x="320" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">予測: 陰性</text>

  <!-- Row headers -->
  <text x="90" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">正解: 陽性</text>
  <text x="90" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">正解: 陰性</text>

  <!-- TP -->
  <rect x="140" y="110" width="120" height="80" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="200" y="138" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">TP</text>
  <text x="200" y="158" text-anchor="middle" font-size="11" fill="#555">True Positive</text>
  <text x="200" y="176" text-anchor="middle" font-size="10" fill="#888">正しく検出</text>

  <!-- FN -->
  <rect x="260" y="110" width="120" height="80" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="320" y="138" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">FN</text>
  <text x="320" y="158" text-anchor="middle" font-size="11" fill="#555">False Negative</text>
  <text x="320" y="176" text-anchor="middle" font-size="10" fill="#888">見逃し</text>

  <!-- FP -->
  <rect x="140" y="190" width="120" height="80" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="200" y="218" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">FP</text>
  <text x="200" y="238" text-anchor="middle" font-size="11" fill="#555">False Positive</text>
  <text x="200" y="256" text-anchor="middle" font-size="10" fill="#888">誤検知</text>

  <!-- TN -->
  <rect x="260" y="190" width="120" height="80" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="320" y="218" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">TN</text>
  <text x="320" y="238" text-anchor="middle" font-size="11" fill="#555">True Negative</text>
  <text x="320" y="256" text-anchor="middle" font-size="10" fill="#888">正しく棄却</text>

  <!-- Precision / Recall Section -->
  <text x="620" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Precision と Recall</text>

  <!-- Precision box -->
  <rect x="450" y="80" width="340" height="100" rx="8" fill="#e1d5e7" fill-opacity="0.3" stroke="#9673a6" stroke-width="1"/>
  <text x="620" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#7B3FA0">Precision（適合率）</text>
  <text x="620" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Precision = TP / (TP + FP)</text>
  <text x="620" y="152" text-anchor="middle" font-size="11" fill="#555">「陽性と予測した」もののうち、本当に陽性だった割合</text>
  <text x="620" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">高い → 誤検知（FP）が少ない</text>

  <!-- Recall box -->
  <rect x="450" y="190" width="340" height="100" rx="8" fill="#dae8fc" fill-opacity="0.3" stroke="#6c8ebf" stroke-width="1"/>
  <text x="620" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E6CA4">Recall（再現率）</text>
  <text x="620" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Recall = TP / (TP + FN)</text>
  <text x="620" y="262" text-anchor="middle" font-size="11" fill="#555">「実際に陽性のもの」のうち、モデルが検出できた割合</text>
  <text x="620" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">高い → 見逃し（FN）が少ない</text>

  <!-- F1 box -->
  <rect x="40" y="305" width="750" height="50" rx="8" fill="#f5f5f5" stroke="#CCC" stroke-width="1"/>
  <text x="415" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">F1 = 2 × Precision × Recall / (Precision + Recall)</text>
  <text x="415" y="346" text-anchor="middle" font-size="11" fill="#666">Precision と Recall の調和平均。どちらかだけ高くても F1 は上がらない</text>

  <!-- Use case title -->
  <text x="410" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">タスクによって重視する指標が変わる</text>

  <!-- Spam -->
  <rect x="60" y="405" width="200" height="80" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="160" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">スパム判定</text>
  <text x="160" y="448" text-anchor="middle" font-size="12" font-weight="bold" fill="#7B3FA0">Precision 重視</text>
  <text x="160" y="470" text-anchor="middle" font-size="10" fill="#666">正常メールを誤ってスパムにしたくない</text>

  <!-- Medical -->
  <rect x="310" y="405" width="200" height="80" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
  <text x="410" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">医療診断</text>
  <text x="410" y="448" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E6CA4">Recall 重視</text>
  <text x="410" y="470" text-anchor="middle" font-size="10" fill="#666">病気の見逃しを絶対に防ぎたい</text>

  <!-- Sentiment -->
  <rect x="560" y="405" width="200" height="80" rx="8" fill="#f5f5f5" stroke="#CCC" stroke-width="1"/>
  <text x="660" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">感情分析</text>
  <text x="660" y="448" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">F1（バランス型）</text>
  <text x="660" y="470" text-anchor="middle" font-size="10" fill="#666">どちらの誤りも同程度に重要</text>
</svg>
