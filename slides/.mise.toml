# Marp CLI configuration for local development
[tools]
node = "20"  # Use Node.js 20 LTS for compatibility
"npm:@marp-team/marp-cli" = "latest"

# Build tasks
[tasks."build:day1"]
description = "Build day1 slide to HTML"
run = "marp slides/day1-slide/main.md --html --allow-local-files -o public/day1.html"

[tasks."build:day1:pdf"]
description = "Build day1 slide to PDF"
run = "marp slides/day1-slide/main.md --pdf --allow-local-files -o public/day1.pdf"

[tasks."build:day1:pptx"]
description = "Build day1 slide to PowerPoint"
run = "marp slides/day1-slide/main.md --pptx --allow-local-files -o public/day1.pptx"

[tasks."build:day2"]
description = "Build day2 slide to HTML"
run = "marp slides/day2-slide/main.md --html --allow-local-files -o public/day2.html"

[tasks."build:day2:pdf"]
description = "Build day2 slide to PDF"
run = "marp slides/day2-slide/main.md --pdf --allow-local-files -o public/day2.pdf"

[tasks."build:day2:pptx"]
description = "Build day2 slide to PowerPoint"
run = "marp slides/day2-slide/main.md --pptx --allow-local-files -o public/day2.pptx"

[tasks."build:all"]
description = "Build all slides to HTML"
run = "marp slides/*/main.md --html --allow-local-files -o public/"

[tasks."export:day1"]
description = "Export day1 slide to all formats (HTML, PDF, PPTX)"
run = """
marp slides/day1-slide/main.md --html --allow-local-files -o public/day1.html
marp slides/day1-slide/main.md --pdf --allow-local-files -o public/day1.pdf
marp slides/day1-slide/main.md --pptx --allow-local-files -o public/day1.pptx
"""

[tasks."export:day2"]
description = "Export day2 slide to all formats (HTML, PDF, PPTX)"
run = """
marp slides/day2-slide/main.md --html --allow-local-files -o public/day2.html
marp slides/day2-slide/main.md --pdf --allow-local-files -o public/day2.pdf
marp slides/day2-slide/main.md --pptx --allow-local-files -o public/day2.pptx
"""

[tasks."export:all"]
description = "Export all slides to all formats"
run = """
marp slides/day1-slide/main.md --html --allow-local-files -o public/day1.html
marp slides/day1-slide/main.md --pdf --allow-local-files -o public/day1.pdf
marp slides/day1-slide/main.md --pptx --allow-local-files -o public/day1.pptx
marp slides/day2-slide/main.md --html --allow-local-files -o public/day2.html
marp slides/day2-slide/main.md --pdf --allow-local-files -o public/day2.pdf
marp slides/day2-slide/main.md --pptx --allow-local-files -o public/day2.pptx
"""

[tasks."serve"]
description = "Start Marp server for preview"
run = "marp -s slides/ -p 8080 --allow-local-files"
