[project]
name = "06-attention"
version = "0.1.0"
description = "Attention メカニズムの可視化ハンズオン - Word2Vec と BERT で Attention の仕組みを理解"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.23.2",
    "pyzmq>=27.1.0",
    "transformers>=4.48",
    "torch>=2.0,<2.8",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "japanize-matplotlib>=1.1.3",
    "numpy>=1.26",
    "gensim>=4.3",
    "fugashi>=1.4",
    "unidic-lite>=1.0.8",
]

[tool.uv]
exclude-newer = "3 days"
