[project]
name = "01-multi-modal"
version = "0.1.0"
description = "SigLIP2 マルチモーダルハンズオン - テキストと画像のベクトル空間理解"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.23.2",
    "pyzmq>=27.1.0",
    "transformers>=4.48",
    "torch>=2.0,<2.8",
    "Pillow>=10.0",
    "matplotlib>=3.8",
    "datasets>=3.0",
    "tensorboardX>=2.6",
    "tensorboard>=2.15",
    "numpy>=1.26",
    "requests>=2.31",
    "setuptools==81.0.0", # https://github.com/tensorflow/tensorboard/issues/7003
]

[tool.uv]
exclude-newer = "3 days"
