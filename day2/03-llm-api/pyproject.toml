[project]
name = "03-llm-api"
version = "0.1.0"
description = "LLM API ハンズオン - Stateless 性質の理解と会話履歴管理"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo==0.23.2",
    "pyzmq>=27.1.0",
    "google-genai>=1.0.0",
]

[tool.uv]
exclude-newer = "3 days"
# VSCode の Marimo 拡張が常に最新バージョンを要求するため exclude-newer の対象から除外
exclude-newer-package = { marimo = false }
