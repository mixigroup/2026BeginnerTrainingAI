[project]
name = "05-react-agent"
version = "0.1.0"
description = "ReAct Agent ハンズオン - Thought/Action/Observation パターンの実装"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.20.2",
    "pyzmq>=27.1.0",
    "google-genai>=1.0.0",
    "llama-index-core>=0.13.0",
    "llama-index-llms-google-genai>=0.1.0",
    "llama-index-embeddings-google-genai>=0.1.0",
    "nest-asyncio>=1.6.0",
    "pypdf>=5.0.0",
    "llama-index-readers-file>=0.4.0",
]

[tool.uv]
exclude-newer = "3 days"
# VSCode の Marimo 拡張が常に最新バージョンを要求するため exclude-newer の対象から除外
exclude-newer-package = { marimo = false }
