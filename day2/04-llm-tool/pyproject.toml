[project]
name = "04-llm-tool"
version = "0.1.0"
description = "Function Calling ハンズオン - while ループによるツール呼び出しの実装"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo==0.23.2",
    "pyzmq>=27.1.0",
    "google-genai>=1.0.0",
    "nbformat>=5.10.4",
]

[tool.uv]
exclude-newer = "3 days"
# VSCode の Marimo 拡張が常に最新バージョンを要求するため exclude-newer の対象から除外
exclude-newer-package = { marimo = false }
