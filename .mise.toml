# Marp CLI configuration for local development
[tools]
node = "20"  # Use Node.js 20 LTS for compatibility
"npm:@marp-team/marp-cli" = "latest"

# Build tasks
[tasks."build:day1"]
description = "Build day1 slide to HTML"
dir = "slides"
run = "marp day1/main.md --html --allow-local-files -o public/day1.html"

[tasks."build:day1:pdf"]
description = "Build day1 slide to PDF"
dir = "slides"
run = "marp day1/main.md --pdf --allow-local-files -o public/day1.pdf"

[tasks."build:day1:pptx"]
description = "Build day1 slide to PowerPoint"
dir = "slides"
run = "marp day1/main.md --pptx --allow-local-files -o public/day1.pptx"

[tasks."build:day2"]
description = "Build day2 slide to HTML"
dir = "slides"
run = "marp day2/main.md --html --allow-local-files -o public/day2.html"

[tasks."build:day2:pdf"]
description = "Build day2 slide to PDF"
dir = "slides"
run = "marp day2/main.md --pdf --allow-local-files -o public/day2.pdf"

[tasks."build:day2:pptx"]
description = "Build day2 slide to PowerPoint"
dir = "slides"
run = "marp day2/main.md --pptx --allow-local-files -o public/day2.pptx"

[tasks."build:all"]
description = "Build all slides to HTML"
dir = "slides"
run = "marp day*/main.md --html --allow-local-files -o public/"

[tasks."export:day1"]
description = "Export day1 slide to all formats (HTML, PDF, PPTX)"
dir = "slides"
run = """
marp day1/main.md --html --allow-local-files -o public/day1.html
marp day1/main.md --pdf --allow-local-files -o public/day1.pdf
marp day1/main.md --pptx --allow-local-files -o public/day1.pptx
"""

[tasks."export:day2"]
description = "Export day2 slide to all formats (HTML, PDF, PPTX)"
dir = "slides"
run = """
marp day2/main.md --html --allow-local-files -o public/day2.html
marp day2/main.md --pdf --allow-local-files -o public/day2.pdf
marp day2/main.md --pptx --allow-local-files -o public/day2.pptx
"""

[tasks."export:all"]
description = "Export all slides to all formats"
dir = "slides"
run = """
marp day1/main.md --html --allow-local-files -o public/day1.html
marp day1/main.md --pdf --allow-local-files -o public/day1.pdf
marp day1/main.md --pptx --allow-local-files -o public/day1.pptx
marp day2/main.md --html --allow-local-files -o public/day2.html
marp day2/main.md --pdf --allow-local-files -o public/day2.pdf
marp day2/main.md --pptx --allow-local-files -o public/day2.pptx
"""

[tasks."serve"]
description = "Start Marp server for preview"
dir = "slides"
run = "marp -s . -p 8080 --allow-local-files"
