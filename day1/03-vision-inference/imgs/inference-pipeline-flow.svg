<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 160" font-family="Arial, sans-serif">
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D79B00"/>
    </marker>
  </defs>

  <!-- 入力 -->
  <rect x="10" y="40" width="120" height="60" rx="10" ry="10" fill="#F5F5F5" stroke="#666666" stroke-width="1.5"/>
  <text x="70" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">入力</text>
  <text x="70" y="85" text-anchor="middle" font-size="11" fill="#333333">テキスト/画像/音声…</text>

  <!-- Arrow: 入力 → Preprocess -->
  <line x1="130" y1="70" x2="158" y2="70" stroke="#D79B00" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Preprocess -->
  <rect x="170" y="40" width="120" height="60" rx="10" ry="10" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5"/>
  <text x="230" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Preprocess</text>
  <text x="230" y="85" text-anchor="middle" font-size="11" fill="#333333">前処理</text>

  <!-- Arrow: Preprocess → Model Forward -->
  <line x1="290" y1="70" x2="328" y2="70" stroke="#D79B00" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="310" y="56" text-anchor="middle" font-size="11" font-weight="bold" font-style="italic" fill="#D79B00">tensor</text>

  <!-- Model Forward -->
  <rect x="340" y="40" width="130" height="60" rx="10" ry="10" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
  <text x="405" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Model Forward</text>
  <text x="405" y="85" text-anchor="middle" font-size="11" fill="#333333">モデル計算</text>

  <!-- Arrow: Model Forward → Postprocess -->
  <line x1="470" y1="70" x2="498" y2="70" stroke="#D79B00" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="485" y="56" text-anchor="middle" font-size="11" font-weight="bold" font-style="italic" fill="#D79B00">tensor</text>

  <!-- Postprocess -->
  <rect x="510" y="40" width="120" height="60" rx="10" ry="10" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5"/>
  <text x="570" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Postprocess</text>
  <text x="570" y="85" text-anchor="middle" font-size="11" fill="#333333">後処理</text>

  <!-- Arrow: Postprocess → 出力 -->
  <line x1="630" y1="70" x2="648" y2="70" stroke="#D79B00" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 出力 -->
  <rect x="660" y="40" width="120" height="60" rx="10" ry="10" fill="#F5F5F5" stroke="#666666" stroke-width="1.5"/>
  <text x="720" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">出力</text>
  <text x="720" y="85" text-anchor="middle" font-size="11" fill="#333333">ラベル/座標/文字列…</text>
</svg>
