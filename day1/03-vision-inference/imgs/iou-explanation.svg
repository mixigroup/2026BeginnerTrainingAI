<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Arial, sans-serif">
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">IoU（Intersection over Union）の直感</text>

  <!-- IoU = 0.0 -->
  <g transform="translate(20, 50)">
    <text x="75" y="15" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">IoU = 0.0</text>
    <rect x="10" y="30" width="60" height="60" fill="#4CAF50" fill-opacity="0.3" stroke="#4CAF50" stroke-width="2"/>
    <rect x="80" y="30" width="60" height="60" fill="#2196F3" fill-opacity="0.3" stroke="#2196F3" stroke-width="2"/>
    <text x="75" y="115" text-anchor="middle" font-size="12" fill="#777">重なりなし</text>
  </g>

  <!-- IoU = 0.25 -->
  <g transform="translate(180, 50)">
    <text x="65" y="15" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">IoU ≈ 0.25</text>
    <rect x="10" y="30" width="60" height="60" fill="#4CAF50" fill-opacity="0.3" stroke="#4CAF50" stroke-width="2"/>
    <rect x="45" y="45" width="60" height="60" fill="#2196F3" fill-opacity="0.3" stroke="#2196F3" stroke-width="2"/>
    <!-- Intersection highlight -->
    <rect x="45" y="45" width="25" height="45" fill="#FF9800" fill-opacity="0.4"/>
    <text x="65" y="130" text-anchor="middle" font-size="12" fill="#777">少し重なり</text>
  </g>

  <!-- IoU = 0.5 -->
  <g transform="translate(340, 50)">
    <text x="60" y="15" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">IoU = 0.5</text>
    <rect x="10" y="30" width="70" height="70" fill="#4CAF50" fill-opacity="0.3" stroke="#4CAF50" stroke-width="2"/>
    <rect x="35" y="40" width="70" height="70" fill="#2196F3" fill-opacity="0.3" stroke="#2196F3" stroke-width="2"/>
    <!-- Intersection highlight -->
    <rect x="35" y="40" width="45" height="60" fill="#FF9800" fill-opacity="0.4"/>
    <text x="60" y="130" text-anchor="middle" font-size="12" fill="#E65100" font-weight="bold">AP50 の基準</text>
  </g>

  <!-- IoU = 0.75 -->
  <g transform="translate(500, 50)">
    <text x="55" y="15" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">IoU = 0.75</text>
    <rect x="10" y="30" width="70" height="70" fill="#4CAF50" fill-opacity="0.3" stroke="#4CAF50" stroke-width="2"/>
    <rect x="18" y="35" width="70" height="70" fill="#2196F3" fill-opacity="0.3" stroke="#2196F3" stroke-width="2"/>
    <!-- Intersection highlight -->
    <rect x="18" y="35" width="62" height="65" fill="#FF9800" fill-opacity="0.4"/>
    <text x="55" y="130" text-anchor="middle" font-size="12" fill="#E65100" font-weight="bold">AP75 の基準</text>
  </g>

  <!-- IoU = 1.0 -->
  <g transform="translate(660, 50)">
    <text x="50" y="15" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">IoU = 1.0</text>
    <rect x="15" y="30" width="70" height="70" fill="#FF9800" fill-opacity="0.5" stroke="#4CAF50" stroke-width="2"/>
    <rect x="15" y="30" width="70" height="70" fill="none" stroke="#2196F3" stroke-width="2" stroke-dasharray="4"/>
    <text x="50" y="115" text-anchor="middle" font-size="12" fill="#777">完全一致</text>
  </g>

  <!-- Legend -->
  <g transform="translate(180, 200)">
    <rect x="0" y="0" width="20" height="14" fill="#4CAF50" fill-opacity="0.3" stroke="#4CAF50" stroke-width="1.5"/>
    <text x="28" y="12" font-size="13" fill="#333">正解 bbox（Ground Truth）</text>

    <rect x="220" y="0" width="20" height="14" fill="#2196F3" fill-opacity="0.3" stroke="#2196F3" stroke-width="1.5"/>
    <text x="248" y="12" font-size="13" fill="#333">予測 bbox（Prediction）</text>
  </g>

  <!-- Formula -->
  <g transform="translate(140, 245)">
    <rect x="0" y="0" width="520" height="55" rx="8" fill="#F5F5F5" stroke="#DDD" stroke-width="1"/>
    <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">IoU = 重なり面積（Intersection）/ 合計面積（Union）</text>
    <text x="260" y="44" text-anchor="middle" font-size="13" fill="#777">値が 1.0 に近いほど予測が正確。閾値を超えた検出を「正解」とみなす</text>
  </g>
</svg>
