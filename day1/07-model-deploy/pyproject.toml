[project]
name = "07-model-deploy"
version = "0.1.0"
description = "SAM model deployment hands-on with Vertex AI custom container"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.23.2",
    # Inference server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    # Model inference
    "torch>=2.10.0",
    "torchvision>=0.22.0",
    "transformers>=4.40",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    # GCS access
    "google-cloud-storage>=2.18.0",
    # Vertex AI SDK (for Step 5: endpoint inference test)
    "google-cloud-aiplatform>=1.70.0",
    # google-auth >=2.36 has a bug with GCE metadata request.session
    "google-auth>=2.29.0,<2.36",
    # Local test (Step 2: request to local server)
    "requests>=2.31.0",
    # Gradio demo (Step 7: optional)
    "gradio>=5.0.0",
    "pyzmq>=27.1.0",
    # Logging
    "loguru>=0.7.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
