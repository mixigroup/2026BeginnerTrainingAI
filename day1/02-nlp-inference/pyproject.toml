[project]
name = "02-nlp-inference"
version = "0.1.0"
description = "日本語感情分析ハンズオン - HuggingFace Transformers を使った NLP 推論の学習用ノートブック"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.23.2",
    "transformers>=4.40.0",
    "torch>=2.0,<2.8",
    "pyzmq>=27.1.0",
    "fugashi>=1.3.0",
    "unidic-lite>=1.0.8",
]

[tool.uv]
exclude-newer = "3 days"
# VSCode の Marimo 拡張が常に最新バージョンを要求するため exclude-newer の対象から除外
exclude-newer-package = { marimo = false }
