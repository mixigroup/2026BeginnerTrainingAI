[project]
name = "04-audio-inference"
version = "0.1.0"
description = "音声認識（ASR）ハンズオン - Whisper を使った音声→テキスト変換の学習用ノートブック"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.23.2",
    "transformers>=4.40.0",
    "torch>=2.0,<2.8",
    "torchaudio>=2.0,<2.8",
    "datasets>=2.0.0,<4.0",
    "jiwer>=3.0.0",
    "matplotlib>=3.0.0",
    "japanize-matplotlib>=1.1.3",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "pyzmq>=27.1.0",
    "accelerate>=1.13.0",
]

[tool.uv]
exclude-newer = "3 days"
# VSCode の Marimo 拡張が常に最新バージョンを要求するため exclude-newer の対象から除外
exclude-newer-package = { marimo = false }
