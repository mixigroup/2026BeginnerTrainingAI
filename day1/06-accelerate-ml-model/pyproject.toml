[project]
name = "06-accelerate-ml-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "transformers>=4.40",
    "Pillow>=10.0",
    "gradio>=5.0.0",
    "onnx>=1.20.1",
    "onnxslim>=0.1.85",
    "onnxruntime>=1.24.2",
    "marimo>=0.20.1",
    "pyzmq>=27.1.0",
    "onnxscript>=0.6.2",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
exclude-newer = "3 days"
# VSCode の Marimo 拡張が常に最新バージョンを要求するため exclude-newer の対象から除外
exclude-newer-package = { marimo = false }
