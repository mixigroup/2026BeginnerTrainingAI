[project]
name = "01-simple-model-inference"
version = "0.1.0"
description = "Iris classification inference hands-on with Neural Network (PyTorch) and LightGBM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.23.2",
    "torch>=2.0,<2.8",
    "pandas>=2.0",
    "seaborn>=0.13",
    "matplotlib>=3.8",
    "numpy>=1.24,<2.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "graphviz>=0.20",
    "tabulate>=0.10.0",
    "pyzmq>=27.1.0",
]

[tool.uv]
exclude-newer = "3 days"
# VSCode の Marimo 拡張が常に最新バージョンを要求するため exclude-newer の対象から除外
exclude-newer-package = { marimo = false }
